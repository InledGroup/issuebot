<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Pulsar OS Signature Gradient (Red -> Purple -> Blue) -->
    <linearGradient id="pulsarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e01b24" />
      <stop offset="50%" stop-color="#9141ac" />
      <stop offset="100%" stop-color="#3584e4" />
    </linearGradient>

    <!-- Squircle Shadow -->
    <filter id="bgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.32" />
    </filter>

    <!-- Icon Shadow for Depth -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Pulsar Rounded Squircle Background -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#pulsarGrad)" filter="url(#bgShadow)" />

  <!-- Lucide Pencil Icon -->
  <g transform="translate(248, 248) scale(22)" 
     fill="none" 
     stroke="#ffffff" 
     stroke-width="2.1" 
     stroke-linecap="round" 
     stroke-linejoin="round"
     filter="url(#iconShadow)">
    <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
    <path d="m15 5 4 4" />
  </g>
</svg>
